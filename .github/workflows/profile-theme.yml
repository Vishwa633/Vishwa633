name: Profile day and night theme
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/select_theme.py
      - .github/workflows/profile-theme.yml
permissions:
  contents: write
concurrency:
  group: profile-theme
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh language statistics
        continue-on-error: true
        run: python scripts/update_language_card.py
      - run: python scripts/select_theme.py
      - name: Commit theme change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/themes/day/languages-bars-v2-emerald-border.svg assets/themes/night/languages-bars-v2-emerald-border.svg
          if ! git diff --cached --quiet; then
            git commit -m "Switch profile theme for Sri Lanka local time"
            git pull --rebase origin main
            git push
          fi
